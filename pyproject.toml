[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "usbscan"
version = "0.1.0"
description = "Layered malware scanner for removable drives"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
dependencies = ["psutil>=5.9"]

[project.optional-dependencies]
yara = ["yara-python>=4.3"]
dev = ["pytest>=7"]

[project.scripts]
usbscan = "usbscan.cli:main"

[tool.setuptools.packages.find]
include = ["usbscan*"]

[tool.setuptools.package-data]
usbscan = ["data/*"]
